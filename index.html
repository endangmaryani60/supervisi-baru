/* ---------- Storage helpers (in-memory + best-effort localStorage) ---------- */
const MEM = {};
const Store = {
  get(key, fallback){
    if (MEM[key] !== undefined) return MEM[key];
    try{
      const raw = localStorage.getItem('sisupak:'+key);
      if (raw){ const v = JSON.parse(raw); MEM[key]=v; return v; }
    }catch(e){}
    MEM[key]=fallback; return fallback;
  },
  set(key, val){
    MEM[key]=val;
    try{ localStorage.setItem('sisupak:'+key, JSON.stringify(val)); }catch(e){}
  }
};

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,10); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){ if(!d) return '-'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }

/* ---------- Google Sheet sync ----------
   Sends one row (object keyed by column name) to a Google Apps Script Web App
   bound to the target spreadsheet. The Web App upserts the row by a key column.
   Because Apps Script Web Apps commonly block CORS on the response, this uses
   mode:'no-cors' — the write still happens, but we can't read success/failure
   back into the app, so it fails silently (by design) if the URL is wrong. */
let __syncQueueTimer = null;
function syncRow(sheetName, keyCol, row){
  const url = (App.school && App.school.sheetWebAppUrl) ? App.school.sheetWebAppUrl.trim() : '';
  if(!url) return;
  fetch(url, {
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ sheet: sheetName, key: keyCol, row })
  }).catch(()=>{});
}
function teacherRow(t){
  return {
    GuruID:t.id, Nama:t.name, NIP:t.nip, Username:t.username, MataPelajaran:t.subject, Kelas:t.classes,
    JadwalPra:t.schedule.pra, JadwalObs:t.schedule.obs, JadwalPasca:t.schedule.pasca,
    Status:t.status, JumlahDokumen:t.documents.length, TerakhirDiperbarui:new Date().toISOString()
  };
}

async function buildInitialState(){
  const teachers = RAW_TEACHERS.map(([name, username], i)=>({
    id: uid('gr'), name, nip:'', username,
    subject:'', classes:'',
    documents: [],
    schedule:{ pra:'', obs:'', pasca:'' },
    status:'belum', // belum | berjalan | selesai
    data: blankInstrumentData()
  }));
  const adminHash = await sha256('admin123');
  const defaultHash = await sha256('123456');
  const users = [
    { username:'admin', passwordHash: adminHash, role:'kepsek', teacherId:null, active:true, mustChangePassword:false, name:'Kepala Sekolah' }
  ];
  for(const t of teachers){
    users.push({ username: t.username, passwordHash: defaultHash, role:'guru', teacherId: t.id, active:true, mustChangePassword:true, name: t.name });
  }
  return {
    school: { name:'Sekolah Anda', kepsekName:'Nama Kepala Sekolah', kepsekNip:'-', pengawasName:'Nama Pengawas', pengawasNip:'-', sheetWebAppUrl:'' },
    teachers, users
  };
}

/* ---------- Global App State ---------- */
const App = {
  school: null, teachers: null, users: null,
  session: null, // {username, role, teacherId, name}
  route: 'dashboard',
  selectedTeacherId: null,
  toast: null,

  async init(){
    let seeded = Store.get('seeded', false);
    if(!seeded){
      const init = await buildInitialState();
      Store.set('school', init.school);
      Store.set('teachers', init.teachers);
      Store.set('users', init.users);
      Store.set('seeded', true);
    }
    this.school = Store.get('school');
    this.teachers = Store.get('teachers');
    this.users = Store.get('users');
    const sess = Store.get('session', null);
    this.session = sess;
    render();
  },
  persist(){
    Store.set('school', this.school);
    Store.set('teachers', this.teachers);
    Store.set('users', this.users);
  },
  showToast(msg, type){
    this.toast = {msg, type: type||'ok'};
    render();
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(()=>{ this.toast=null; render(); }, 2600);
  },
  currentTeacher(){
    if(!this.session) return null;
    if(this.session.role==='guru') return this.teachers.find(t=>t.id===this.session.teacherId);
    return this.teachers.find(t=>t.id===this.selectedTeacherId);
  },
  async login(username, password, remember){
    const u = this.users.find(x=>x.username.toLowerCase()===username.trim().toLowerCase());
    if(!u) return {ok:false, msg:'Username tidak ditemukan.'};
    if(!u.active) return {ok:false, msg:'Akun ini telah dinonaktifkan. Hubungi Kepala Sekolah.'};
    const hash = await sha256(password);
    if(hash !== u.passwordHash) return {ok:false, msg:'Password salah.'};
    const sess = { username:u.username, role:u.role, teacherId:u.teacherId, name:u.name, mustChangePassword:u.mustChangePassword };
    this.session = sess;
    Store.set('session', sess);
    if(!remember){ /* still kept in memory for this run */ }
    u.lastLogin = new Date().toISOString();
    this.persist();
    syncRow('Akun','Username',{ Username:u.username, NamaLengkap:u.name, Role:u.role, Status:u.active?'Aktif':'Nonaktif', TerakhirLogin:u.lastLogin });
    this.route = 'dashboard';
    return {ok:true};
  },
  logout(){
    this.session = null;
    Store.set('session', null);
    this.route = 'dashboard';
    render();
  },
  can(menu){
    if(!this.session) return false;
    if(this.session.role==='kepsek') return true;
    const guruMenus = ['dashboard','profil','dokumen','jadwal','instrumen','laporan','akun-sendiri'];
    return guruMenus.includes(menu);
  }
};

/* ---------- Small UI helpers ---------- */
function el(tag, attrs, children){
  attrs = attrs||{};
  let cls = attrs.class ? ` class="${attrs.class}"` : '';
  return {tag, attrs, cls, children};
}
function h(strings, ...vals){ return strings.reduce((acc,s,i)=> acc+s+(vals[i]!==undefined?vals[i]:''), ''); }
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function statusBadge(status){
  if(status==='selesai') return `<span class="badge badge-ok">Selesai</span>`;
  if(status==='berjalan') return `<span class="badge badge-warn">Sedang Berjalan</span>`;
  return `<span class="badge badge-idle">Belum Supervisi</span>`;
}
function computeStatus(t){
  const {pra,obs,pasca} = t.schedule;
  const hasResult = t.data.finalScore!==null;
  if(hasResult || (pra&&obs&&pasca && t.data.pasca.kesepakatan)) return 'selesai';
  if(pra||obs||pasca) return 'berjalan';
  return 'belum';
}

/* ================= RENDER ROOT ================= */
function render(){
  const root = document.getElementById('root');
  if(!App.session){ root.innerHTML = LoginView(); attachLoginHandlers(); return; }
  // refresh computed status
  App.teachers.forEach(t=> t.status = computeStatus(t));
  root.innerHTML = ShellView();
  attachShellHandlers();
}

function attachLoginHandlers(){
  const form = document.getElementById('loginForm');
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const username = document.getElementById('loginUsername').value;
    const password = document.getElementById('loginPassword').value;
    const remember = document.getElementById('rememberMe').checked;
    const btn = form.querySelector('button[type=submit]');
    btn.textContent = 'Memeriksa...'; btn.disabled = true;
    const res = await App.login(username, password, remember);
    if(!res.ok){
      const err = document.getElementById('loginError');
      err.textContent = res.msg; err.classList.remove('hidden');
      btn.textContent='Masuk'; btn.disabled=false;
      return;
    }
    render();
  });
}

function routeView(){
  const r = App.route;
  try{
    if(r==='dashboard') return App.session.role==='kepsek' ? DashboardKepsek() : DashboardGuru();
    if(r==='program') return ProgramSupervisi();
    if(r==='guru') return DataGuru();
    if(r==='dokumen') return DokumenPerangkat();
    if(r==='instrumen') return InstrumenView();
    if(r==='laporan') return LaporanHasil();
    if(r==='tindaklanjut') return TindakLanjut();
    if(r==='akun') return ManajemenAkun();
    if(r==='pengaturan') return PengaturanSekolah();
    if(r==='profil') return ProfilGuru();
    if(r==='jadwal') return JadwalGuru();
    if(r==='akun-sendiri') return GantiPassword();
  }catch(err){ console.error(err); return `<div class="card p-6 text-sm" style="color:var(--danger)">Terjadi kesalahan saat memuat halaman ini.</div>`; }
  return `<div class="card p-6">Halaman tidak ditemukan.</div>`;
}

/* ---------- Shared shell handlers ---------- */
function attachShellHandlers(){
  document.querySelectorAll('[data-route]').forEach(node=>{
    node.addEventListener('click', ()=>{ App.route = node.getAttribute('data-route'); App.selectedTeacherId=null; render(); });
  });
  const mob = document.getElementById('mobileNav');
  if(mob) mob.addEventListener('change', ()=>{ App.route = mob.value; render(); });
  const logout = document.getElementById('logoutBtn');
  if(logout) logout.addEventListener('click', ()=> App.logout());
  attachRouteHandlers();
}

/* Delegated per-route handler attach; each view sets window.__routeHandlers */
function attachRouteHandlers(){
  if(window.__routeHandlers) window.__routeHandlers();
}

function DashboardKepsek(){

async function openTeacherModal(id){
  const isNew = !id;
  const t = isNew ? {id:null,name:'',nip:'',username:'',subject:'',classes:'',schedule:{pra:'',obs:'',pasca:''}} : App.teachers.find(x=>x.id===id);
  const modal = document.getElementById('modalRoot');
  modal.innerHTML = `
  <div class="modal-bg" id="teacherModalBg">
    <div class="card p-6 w-full max-w-lg fade-in">
      <h3 class="display font-bold text-lg mb-4" style="color:var(--navy)">${isNew?'Tambah Guru':'Edit Data Guru'}</h3>
      <div class="space-y-3">
        <div><label class="text-xs font-semibold" style="color:var(--muted)">Nama Lengkap</label><input id="m_name" value="${esc(t.name)}" /></div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-xs font-semibold" style="color:var(--muted)">NIP</label><input id="m_nip" value="${esc(t.nip)}" /></div>
          <div><label class="text-xs font-semibold" style="color:var(--muted)">Username</label><input id="m_username" value="${esc(t.username)}" ${!isNew?'':''} /></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="text-xs font-semibold" style="color:var(--muted)">Mata Pelajaran</label><input id="m_subject" value="${esc(t.subject)}" /></div>
          <div><label class="text-xs font-semibold" style="color:var(--muted)">Kelas Diampu</label><input id="m_classes" value="${esc(t.classes)}" placeholder="mis. X TKJ" /></div>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div><label class="text-xs font-semibold" style="color:var(--muted)">Tgl Pra-Observasi</label><input type="date" id="m_pra" value="${t.schedule.pra}" /></div>
          <div><label class="text-xs font-semibold" style="color:var(--muted)">Tgl Observasi</label><input type="date" id="m_obs" value="${t.schedule.obs}" /></div>
          <div><label class="text-xs font-semibold" style="color:var(--muted)">Tgl Pasca-Observasi</label><input type="date" id="m_pasca" value="${t.schedule.pasca}" /></div>
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-6">
        <button class="btn btn-ghost px-4 py-2 text-sm" id="m_cancel">Batal</button>
        <button class="btn btn-primary px-4 py-2 text-sm" id="m_save">Simpan</button>
      </div>
    </div>
  </div>`;
  document.getElementById('m_cancel').onclick = ()=> modal.innerHTML='';
  document.getElementById('teacherModalBg').addEventListener('click', (e)=>{ if(e.target.id==='teacherModalBg') modal.innerHTML=''; });
  document.getElementById('m_save').onclick = async ()=>{
    const name = document.getElementById('m_name').value.trim();
    const username = document.getElementById('m_username').value.trim().toLowerCase();
    if(!name || !username){ alert('Nama dan username wajib diisi.'); return; }
    if(isNew){
      if(App.users.some(u=>u.username===username)){ alert('Username sudah digunakan.'); return; }
      const newT = {
        id: uid('gr'), name, nip: document.getElementById('m_nip').value.trim(), username,
        subject: document.getElementById('m_subject').value.trim(), classes: document.getElementById('m_classes').value.trim(),
        documents:[], schedule:{ pra:document.getElementById('m_pra').value, obs:document.getElementById('m_obs').value, pasca:document.getElementById('m_pasca').value },
        status:'belum', data: blankInstrumentData()
      };
      App.teachers.push(newT);
      const hash = await sha256('123456');
      App.users.push({ username, passwordHash:hash, role:'guru', teacherId:newT.id, active:true, mustChangePassword:true, name });
      syncRow('DataGuru','GuruID', teacherRow(newT));
      syncRow('Akun','Username', { Username:username, NamaLengkap:name, Role:'guru', Status:'Aktif', TerakhirLogin:'' });
    } else {
      t.name = name; t.nip = document.getElementById('m_nip').value.trim();
      t.subject = document.getElementById('m_subject').value.trim(); t.classes = document.getElementById('m_classes').value.trim();
      t.schedule.pra = document.getElementById('m_pra').value; t.schedule.obs = document.getElementById('m_obs').value; t.schedule.pasca = document.getElementById('m_pasca').value;
      const u = App.users.find(u=>u.teacherId===t.id); if(u) u.name = name;
      syncRow('DataGuru','GuruID', teacherRow(t));
    }
    App.persist(); modal.innerHTML=''; App.showToast('Data guru tersimpan.'); render();
  };
}

/* ================= DOKUMEN PERANGKAT ================= */
function DokumenPerangkat(){
  const isGuru = App.session.role==='guru';
  const list = App.teachers;
  const selId = isGuru ? App.session.teacherId : (App.selectedTeacherId || (list[0] && list[0].id));
  const sel = list.find(t=>t.id===selId);
  const q = App._docQuery || '';
  const filtered = list.filter(t=> t.name.toLowerCase().includes(q.toLowerCase()));

  window.__routeHandlers = ()=>{
    if(!isGuru){
      const search = document.getElementById('docSearch');
      if(search) search.addEventListener('input', ()=>{ App._docQuery = search.value; render(); });
      document.querySelectorAll('[data-selteacher]').forEach(b=> b.addEventListener('click', ()=>{ App.selectedTeacherId = b.getAttribute('data-selteacher'); render(); }));
    }
    const upload = document.getElementById('docUpload');
    if(upload) upload.addEventListener('change', ()=>{
      const files = Array.from(upload.files);
      files.forEach(f=>{
        const doc = {id:uid('doc'), name:f.name, size:f.size, uploadedAt:new Date().toISOString()};
        sel.documents.push(doc);
        syncRow('Dokumen','DokID', { DokID:doc.id, GuruID:sel.id, NamaGuru:sel.name, NamaFile:doc.name, UkuranKB:Math.round(doc.size/1024), TanggalUnggah:doc.uploadedAt });
      });
      syncRow('DataGuru','GuruID', teacherRow(sel));
      App.persist(); App.showToast(`${files.length} dokumen diunggah.`); render();
    });
    document.querySelectorAll('[data-rmdoc]').forEach(b=> b.addEventListener('click', ()=>{
      sel.documents = sel.documents.filter(d=>d.id!==b.getAttribute('data-rmdoc'));
      App.persist(); render();
    }));
  };

  return `
  <h1 class="display text-2xl font-extrabold mb-1" style="color:var(--navy)">${isGuru?'Perangkat Pembelajaran':'Dokumen Perangkat'}</h1>
  <p class="text-sm mb-6" style="color:var(--muted)">Unggah RPP, Modul Ajar, ATP, CP, Bahan Ajar, Media, LKPD, dan Asesmen.</p>
  <div class="grid md:grid-cols-3 gap-5">
    ${!isGuru ? `
    <div class="card p-4 md:col-span-1">
      <input id="docSearch" placeholder="Cari guru..." value="${esc(q)}" class="mb-3" />
      <div class="space-y-1 max-h-[480px] overflow-y-auto">
        ${filtered.map(t=>`<div data-selteacher="${t.id}" class="sidebar-link" style="color:${sel&&sel.id===t.id?'#fff':'var(--ink)'}; background:${sel&&sel.id===t.id?'var(--navy)':'transparent'};">
          <span>${sel&&sel.id===t.id? '👤':'👥'}</span><span class="truncate">${esc(t.name)}</span>
        </div>`).join('')}
      </div>
    </div>` : ''}

function attachInstrumentFormHandlers(t, tab, isGuru){
  if(!t) return;
  document.querySelectorAll('[data-rpp]').forEach(b=> b.addEventListener('click', ()=>{
    t.data.pra.rpp[b.getAttribute('data-rpp')] = b.getAttribute('data-val'); render();
  }));
  const saveBtn = document.getElementById('saveInstBtn');
  if(saveBtn) saveBtn.addEventListener('click', ()=> saveInstrument(t, tab));
}

function readInstrumentFormIntoState(t, tab){
  const materi = document.getElementById('f_materi'); if(materi && !materi.disabled) t.data.materiPokok = materi.value;
  const sem = document.getElementById('f_semester'); if(sem && !sem.disabled) t.data.semester = sem.value;
  const tahun = document.getElementById('f_tahun'); if(tahun && !tahun.disabled) t.data.tahunAjaran = tahun.value;

  if(tab==='pra'){
    document.querySelectorAll('[data-rppnote]').forEach(inp=>{ t.data.pra.rppNotes = t.data.pra.rppNotes||{}; t.data.pra.rppNotes[inp.getAttribute('data-rppnote')] = inp.value; });
    document.querySelectorAll('[data-wawancara]').forEach(inp=> t.data.pra.wawancara[inp.getAttribute('data-wawancara')] = inp.value);
    const k=document.getElementById('f_kelebihan'), p=document.getElementById('f_peningkatan'), r=document.getElementById('f_rekomendasi');
    if(k) t.data.pra.kelebihan = k.value; if(p) t.data.pra.peningkatan = p.value; if(r) t.data.pra.rekomendasi = r.value;
  }
  if(tab==='obs'){
    document.querySelectorAll('[data-score]').forEach(b=>{ /* handled by click below */ });
    document.querySelectorAll('[data-bukti]').forEach(inp=> t.data.obs.bukti[inp.getAttribute('data-bukti')] = inp.value);
    document.querySelectorAll('[data-obsnote]').forEach(inp=> t.data.obs.catatan[inp.getAttribute('data-obsnote')] = inp.value);
    const rg=document.getElementById('f_refleksiObs'); if(rg) t.data.obs.refleksiGuru = rg.value;
    const c=document.getElementById('f_obsCatatan'), rk=document.getElementById('f_obsRekomendasi'), tl=document.getElementById('f_obsTindakLanjut');
    if(c) t.data.obs.catatanSupervisor = c.value; if(rk) t.data.obs.rekomendasi = rk.value; if(tl) t.data.obs.tindakLanjut = tl.value;
    // compute final score average of skor
    const vals = Object.values(t.data.obs.skor).filter(v=>v>0);
    if(vals.length){
      const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
      t.data.finalScore = avg;
      t.data.finalLabel = avg>=3.5?'Sangat Baik': avg>=2.5?'Baik': avg>=1.5?'Cukup':'Perlu Bimbingan';
    }
  }
  if(tab==='pasca'){
    document.querySelectorAll('[data-refleksi]').forEach(inp=> t.data.pasca.refleksiGuru[inp.getAttribute('data-refleksi')] = inp.value);
    document.querySelectorAll('[data-umpankuat]').forEach(inp=>{ const i=inp.getAttribute('data-umpankuat'); t.data.pasca.umpanBalik[i]=t.data.pasca.umpanBalik[i]||{}; t.data.pasca.umpanBalik[i].kuat=inp.value; });
    document.querySelectorAll('[data-umpandev]').forEach(inp=>{ const i=inp.getAttribute('data-umpandev'); t.data.pasca.umpanBalik[i]=t.data.pasca.umpanBalik[i]||{}; t.data.pasca.umpanBalik[i].dev=inp.value; });
    document.querySelectorAll('[data-aksi]').forEach(inp=>{ const i=inp.getAttribute('data-aksi'); t.data.pasca.rencanaAksi[i]=t.data.pasca.rencanaAksi[i]||{}; t.data.pasca.rencanaAksi[i].aksi=inp.value; });
    document.querySelectorAll('[data-pic]').forEach(inp=>{ const i=inp.getAttribute('data-pic'); t.data.pasca.rencanaAksi[i]=t.data.pasca.rencanaAksi[i]||{}; t.data.pasca.rencanaAksi[i].pic=inp.value; });
    document.querySelectorAll('[data-waktu]').forEach(inp=>{ const i=inp.getAttribute('data-waktu'); t.data.pasca.rencanaAksi[i]=t.data.pasca.rencanaAksi[i]||{}; t.data.pasca.rencanaAksi[i].waktu=inp.value; });
    const c=document.getElementById('f_pascaCatatan'), ks=document.getElementById('f_pascaKesepakatan');
    if(c) t.data.pasca.catatanSupervisor = c.value; if(ks) t.data.pasca.kesepakatan = ks.value;
  }
}

// score buttons for observasi need direct binding (delegated after render, so bind here too)
document.addEventListener('click', function(e){
  const btn = e.target.closest('[data-score]');
  if(btn){
    const t = App.currentTeacher(); if(!t) return;

function saveInstrument(t, tab){
  readInstrumentFormIntoState(t, tab);
  App.persist();
  const now = new Date().toISOString();
  if(tab==='pra'){
    const rppYa = Object.values(t.data.pra.rpp).filter(v=>v==='ya').length;
    const rppTidak = Object.values(t.data.pra.rpp).filter(v=>v==='tidak').length;
    syncRow('PraObservasi','GuruID', {
      GuruID:t.id, NamaGuru:t.name, Semester:t.data.semester, TahunAjaran:t.data.tahunAjaran, MateriPokok:t.data.materiPokok,
      RPP_Ya:rppYa, RPP_Tidak:rppTidak, CatatanRPP_JSON:JSON.stringify(t.data.pra.rppNotes||{}),
      Wawancara_JSON:JSON.stringify(t.data.pra.wawancara), Kelebihan:t.data.pra.kelebihan,
      Peningkatan:t.data.pra.peningkatan, Rekomendasi:t.data.pra.rekomendasi, TerakhirDiperbarui:now
    });
  } else if(tab==='obs'){
    syncRow('Observasi','GuruID', {
      GuruID:t.id, NamaGuru:t.name, Semester:t.data.semester, TahunAjaran:t.data.tahunAjaran, MateriPokok:t.data.materiPokok,
      Skor_JSON:JSON.stringify(t.data.obs.skor), Bukti_JSON:JSON.stringify(t.data.obs.bukti), Catatan_JSON:JSON.stringify(t.data.obs.catatan),
      RefleksiGuru:t.data.obs.refleksiGuru, CatatanSupervisor:t.data.obs.catatanSupervisor, Rekomendasi:t.data.obs.rekomendasi,
      TindakLanjut:t.data.obs.tindakLanjut, NilaiAkhir:t.data.finalScore, Label:t.data.finalLabel, TerakhirDiperbarui:now
    });
  } else if(tab==='pasca'){
    syncRow('PascaObservasi','GuruID', {
      GuruID:t.id, NamaGuru:t.name, Refleksi_JSON:JSON.stringify(t.data.pasca.refleksiGuru),
      UmpanBalik_JSON:JSON.stringify(t.data.pasca.umpanBalik), RencanaAksi_JSON:JSON.stringify(t.data.pasca.rencanaAksi),
      CatatanSupervisor:t.data.pasca.catatanSupervisor, Kesepakatan:t.data.pasca.kesepakatan, TerakhirDiperbarui:now
    });
  }
  syncRow('DataGuru','GuruID', teacherRow(t));
  App.showToast('Data instrumen tersimpan.');
  render();
}

      <div class="text-xs mt-1" style="color:var(--muted)">Semester ${esc(d.semester)} — Tahun Pelajaran ${esc(d.tahunAjaran)}</div>

/* ================= MANAJEMEN AKUN ================= */
function ManajemenAkun(){
  const q = App._akunQuery || '';
  const filtered = App.users.filter(u=> u.name.toLowerCase().includes(q.toLowerCase()) || u.username.includes(q.toLowerCase()));
  window.__routeHandlers = ()=>{
    const search = document.getElementById('akunSearch');
    if(search) search.addEventListener('input', ()=>{ App._akunQuery = search.value; render(); });
    document.querySelectorAll('[data-toggle]').forEach(b=> b.addEventListener('click', ()=>{
      const u = App.users.find(x=>x.username===b.getAttribute('data-toggle')); u.active = !u.active; App.persist();
      syncRow('Akun','Username',{ Username:u.username, NamaLengkap:u.name, Role:u.role, Status:u.active?'Aktif':'Nonaktif', TerakhirLogin:u.lastLogin||'' });
      render();
    }));
    document.querySelectorAll('[data-reset]').forEach(b=> b.addEventListener('click', async ()=>{
      const u = App.users.find(x=>x.username===b.getAttribute('data-reset'));
      const np = prompt(`Password baru untuk ${u.name} (min. 6 karakter):`, '123456');
      if(np && np.length>=6){
        u.passwordHash = await sha256(np); u.mustChangePassword = true; App.persist();
        syncRow('Akun','Username',{ Username:u.username, NamaLengkap:u.name, Role:u.role, Status:u.active?'Aktif':'Nonaktif', TerakhirLogin:u.lastLogin||'' });
        App.showToast('Password berhasil direset.');
      }
    }));
    document.querySelectorAll('[data-delacc]').forEach(b=> b.addEventListener('click', ()=>{
      if(b.getAttribute('data-delacc')==='admin'){ alert('Akun Kepala Sekolah utama tidak dapat dihapus.'); return; }
      if(confirm('Hapus akun ini?')){ App.users = App.users.filter(u=>u.username!==b.getAttribute('data-delacc')); App.persist(); render(); }
    }));
  };
  return `
  <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
    <div>
      <h1 class="display text-2xl font-extrabold" style="color:var(--navy)">Manajemen Akun</h1>
      <p class="text-sm mt-1" style="color:var(--muted)">${App.users.length} akun terdaftar (1 Kepala Sekolah, ${App.users.length-1} Guru).</p>
    </div>
    <input id="akunSearch" placeholder="Cari akun..." value="${esc(q)}" style="width:220px;" />
  </div>
  <div class="card overflow-x-auto">
    <table>
      <thead><tr><th>Nama</th><th>Username</th><th>Role</th><th>Status</th><th>Login Terakhir</th><th></th></tr></thead>
      <tbody>
      ${filtered.map(u=>`
        <tr>
          <td class="font-semibold">${esc(u.name)}</td>
          <td>@${esc(u.username)}</td>
          <td><span class="badge ${u.role==='kepsek'?'badge-warn':'badge-idle'}">${u.role==='kepsek'?'Kepala Sekolah':'Guru'}</span></td>
          <td>${u.active? `<span class="badge badge-ok">Aktif</span>`:`<span class="badge badge-danger">Nonaktif</span>`}</td>
          <td class="text-xs">${u.lastLogin? new Date(u.lastLogin).toLocaleString('id-ID') : 'Belum pernah'}</td>
          <td class="whitespace-nowrap">
            <button class="btn btn-ghost px-2 py-1 text-xs" data-reset="${u.username}">Reset Password</button>
            <button class="btn btn-ghost px-2 py-1 text-xs" data-toggle="${u.username}">${u.active?'Nonaktifkan':'Aktifkan'}</button>
            <button class="btn btn-danger px-2 py-1 text-xs" data-delacc="${u.username}">Hapus</button>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

function GantiPassword(){
  window.__routeHandlers = ()=>{
    document.getElementById('pwForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const u = App.users.find(x=>x.username===App.session.username);
      const cur = document.getElementById('pw_current').value;
      const curHash = await sha256(cur);
      const err = document.getElementById('pwErr'); err.classList.add('hidden');
      if(curHash !== u.passwordHash){ err.textContent='Password saat ini salah.'; err.classList.remove('hidden'); return; }
      const np = document.getElementById('pw_new').value;
      const np2 = document.getElementById('pw_confirm').value;
      if(np.length<6){ err.textContent='Password baru minimal 6 karakter.'; err.classList.remove('hidden'); return; }
      if(np!==np2){ err.textContent='Konfirmasi password tidak cocok.'; err.classList.remove('hidden'); return; }
      u.passwordHash = await sha256(np); u.mustChangePassword=false; App.persist();
      App.showToast('Password berhasil diperbarui.');
      document.getElementById('pwForm').reset();
    });
  };
  const mustChange = App.session.mustChangePassword;
  return `
  <h1 class="display text-2xl font-extrabold mb-1" style="color:var(--navy)">Ganti Password</h1>
  ${mustChange? `<div class="mb-4 p-3 rounded-lg text-sm" style="background:#fbf0dc;color:#7a5a12;">Demi keamanan, disarankan mengganti password default Anda.</div>` : ''}
  <form id="pwForm" class="card p-6 max-w-sm space-y-3 mt-4">
    <div><label class="text-xs font-semibold" style="color:var(--muted)">Password Saat Ini</label><input type="password" id="pw_current" required /></div>
    <div><label class="text-xs font-semibold" style="color:var(--muted)">Password Baru</label><input type="password" id="pw_new" required /></div>
    <div><label class="text-xs font-semibold" style="color:var(--muted)">Konfirmasi Password Baru</label><input type="password" id="pw_confirm" required /></div>
    <div id="pwErr" class="text-sm hidden" style="color:var(--danger)"></div>
    <button class="btn btn-primary w-full py-2.5 text-sm">Simpan Password</button>
  </form>`;
}
